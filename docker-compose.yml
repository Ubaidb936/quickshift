version: '3.8'

services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER:     quickshift
      POSTGRES_PASSWORD: quickshift
      POSTGRES_DB:       quickshift
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives docker-compose down
    ports:
      - "5432:5432"   # expose so you can connect with a DB client (TablePlus, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickshift"]
      interval: 5s    # check every 5 seconds
      timeout: 5s     # fail if no response in 5 seconds
      retries: 5      # give up after 5 failures

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python init_db.py && gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - WEB_CONCURRENCY=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:   # named volume — managed by Docker, persists between restarts
